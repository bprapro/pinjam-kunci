<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilih Lokasi Kunci - Denah Mall</title>
  
  <!-- Font Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Background Fullscreen Hutan/Alam sesuai sampel gambar */
    body {
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    /* Overlay gelap tipis agar container lebih menyala */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: 0;
    }

    /* Container Utama (Card Melayang Putih Bersih) */
    .app-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1050px;
      background: #ffffff;
      border-radius: 40px;
      padding: 24px;
      display: flex;
      gap: 25px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
      align-items: stretch;
    }

    /* --- KOLOM KIRI (SIDEBAR FORM) --- */
    .sidebar {
      flex: 1.1;
      padding: 30px 20px 20px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand-logo {
      font-size: 16px;
      font-weight: 800;
      color: #375b4f;
      letter-spacing: -0.5px;
      margin-bottom: 25px;
    }

    .title-header {
      font-size: 32px;
      font-weight: 800;
      color: #111827;
      line-height: 1.15;
      letter-spacing: -0.8px;
      margin-bottom: 30px;
    }

    .form-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Label Input Tipis & Elegan */
    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: #6b7280;
      margin-bottom: 4px;
      display: block;
      margin-left: 12px;
    }

    /* Select Box Bentuk Pill Sesuai Gambar */
    .select-wrapper {
      position: relative;
    }

    .select-pill {
      width: 100%;
      padding: 15px 22px;
      border-radius: 50px;
      border: none;
      outline: none;
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      background: #f3f4f6;
      appearance: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .select-pill:hover {
      background: #e5e7eb;
    }

    .select-pill:focus {
      background: #ffffff;
      box-shadow: 0 0 0 2px #375b4f;
    }

    .select-wrapper::after {
      content: '▾';
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #9ca3af;
      font-size: 14px;
    }

    /* Tombol Utama Hijau Forest (#375b4f) */
    .btn-submit {
      width: 100%;
      padding: 16px;
      border-radius: 50px;
      border: none;
      background: #375b4f;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 10px 20px rgba(55, 91, 79, 0.25);
    }

    .btn-submit:hover {
      background: #2b473e;
      transform: translateY(-1px);
    }

    .footer-link {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: #6b7280;
    }

    .footer-link a {
      color: #111827;
      font-weight: 700;
      text-decoration: none;
    }

    .footer-link a:hover {
      text-decoration: underline;
    }

    /* --- KOLOM KANAN (DENAH LAYOUT) --- */
    .map-wrapper {
      flex: 1.4;
      border-radius: 32px;
      overflow: hidden;
      position: relative;
      min-height: 520px;
      background: #e5e7eb;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 520px;
      background: #2d3748;
      z-index: 1;
    }

    /* Custom Zoom Controls Ala Minimalis */
    .custom-controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 5;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 8px 18px;
      display: flex;
      gap: 15px;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
      color: #111827;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .custom-controls span {
      cursor: pointer;
      user-select: none;
    }

    .custom-controls span:hover {
      color: #375b4f;
    }

    /* --- MARKER PIN & FLOATING TOOLTIP ALA VOIGER (GAMBAR) --- */
    /* Marker Ring Glowing Dot */
    .custom-marker {
      position: relative;
    }

    .marker-dot {
      width: 14px;
      height: 14px;
      background: #ffffff;
      border: 3px solid #375b4f;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .custom-marker:hover .marker-dot {
      transform: scale(1.3);
      background: #375b4f;
    }

    .marker-dot.borrowed {
      border-color: #ef4444;
    }

    /* Glassmorphism Floating Card Tooltip persis Gambar */
    .leaflet-tooltip-voyager {
      background: rgba(255, 255, 255, 0.85) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border: 1px solid rgba(255, 255, 255, 0.6) !important;
      border-radius: 20px !important;
      padding: 10px 16px !important;
      box-shadow: 0 15px 35px rgba(0,0,0,0.12) !important;
      color: #111827 !important;
      font-size: 13px !important;
      font-weight: 600 !important;
    }
    
    .leaflet-tooltip-voyager::before {
      display: none;
    }

    .tooltip-card {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tooltip-icon {
      width: 28px;
      height: 28px;
      background: rgba(55, 91, 79, 0.1);
      color: #375b4f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .status-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
      margin-top: 3px;
      display: inline-block;
    }
    .status-available { background: #dcfce7; color: #15803d; }
    .status-borrowed { background: #fee2e2; color: #b91c1c; }

    /* Overlay Loading */
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(5px);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #375b4f;
    }

    /* Responsive untuk Layar Kecil */
    @media (max-width: 850px) {
      .app-card {
        flex-direction: column;
        border-radius: 30px;
      }
      .sidebar { padding: 10px; }
      .map-wrapper { min-height: 380px; border-radius: 24px; }
      #map { min-height: 380px; }
    }
  </style>
</head>
<body>

<div class="app-card">
  
  <!-- KOLOM KIRI (FORM INPUT) -->
  <div class="sidebar">
    <div>
      <div class="brand-logo">keymanager</div>
      <h1 class="title-header">Pilih lokasi<br>kunci Anda</h1>

      <div class="form-container">
        <div>
          <label class="form-label">Lantai Mall</label>
          <div class="select-wrapper">
            <select id="select-lantai" class="select-pill" onchange="renderCurrentLantai()">
              <option value="LG" selected>Lantai LG</option>
              <option value="L1">Lantai L1</option>
              <option value="L2">Lantai L2</option>
              <option value="L3">Lantai L3</option>
              <option value="L4">Lantai L4</option>
            </select>
          </div>
        </div>

        <div>
          <label class="form-label">Zona Area</label>
          <div class="select-wrapper">
            <select id="select-zona" class="select-pill">
              <option value="A">Zona A</option>
              <option value="B">Zona B</option>
              <option value="C">Zona C</option>
            </select>
          </div>
        </div>

        <div>
          <label class="form-label">Nomor Kunci / Ruangan</label>
          <div class="select-wrapper">
            <select id="select-kunci" class="select-pill">
              <option value="">Pilih via Peta / Dropdown</option>
            </select>
          </div>
        </div>

        <button class="btn-submit" onclick="submitPilihanKunci()">Pilih Kunci Ini</button>
      </div>
    </div>

    <div class="footer-link">
      Kembali ke <a href="index.html">Form Peminjaman</a>
    </div>
  </div>

  <!-- KOLOM KANAN (MAP LAYOUT VOYAGER STYLE) -->
  <div class="map-wrapper">
    <div id="loading-indicator" class="loading-overlay" style="display: none;">Memuat Data Kunci...</div>
    <div id="map"></div>
    
    <!-- Controls Zoom & Fit Floating -->
    <div class="custom-controls">
      <span onclick="map.zoomIn()">+</span>
      <span style="opacity: 0.3;">|</span>
      <span onclick="map.zoomOut()">-</span>
      <span style="opacity: 0.3;">|</span>
      <span onclick="resetViewMap()">Reset</span>
    </div>
  </div>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // =========================================================
  // 1. ISIKAN URL APPS SCRIPT ANDA DI SINI
  // =========================================================
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxGoHYvbAnvd3IjS1eQrUUiChTY--AFqCzQoTHtfg97k5hreaTqEnruiF5MmaqqXFyrQA/exec";

  // Inisialisasi Map Leaflet (CRS Simple untuk denah image)
  const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -1,
    maxZoom: 2,
    zoomControl: false
  });

  const bounds = [[0, 0], [1000, 1400]];
  let currentOverlay = null;
  let markersGroup = L.layerGroup().addTo(map);

  // Mapping File Gambar Denah Lantai
  const gambarDenahLantai = {
    'LG': 'LG.jpg',
    'L1': 'L1.jpg',
    'L2': 'L2.jpg',
    'L3': 'L3.jpg',
    'L4': 'L4.jpg'
  };

  // Titik Koordinat Posisi Pin Marker di Peta
  const koordinatKunciMap = {
    '3 - PINTU KACA': [480, 430],
    '4 - SELMA': [520, 780],
    '5 - AZKO': [660, 910],
    'L1-01': [400, 100],
    'L1-02': [700, 100]
  };

  let globalDataKunci = [];

  // 2. AMBIL DATA REALTIME DARI GOOGLE APPS SCRIPT
  async function fetchSpreadsheetData() {
    toggleLoading(true);
    try {
      const response = await fetch(`${WEB_APP_URL}?aksi=ambil_status_lengkap`);
      const data = await response.json();
      globalDataKunci = data;
      renderCurrentLantai();
    } catch (error) {
      console.error("Gagal mengambil data Spreadsheet:", error);
      alert("Gagal memuat data dari database spreadsheet.");
    } finally {
      toggleLoading(false);
    }
  }

  // 3. RENDER MAP & MARKER PARALLEL UI VOYAGER
  function renderCurrentLantai() {
    const selectedFloor = document.getElementById('select-lantai').value;
    const imagePath = gambarDenahLantai[selectedFloor] || 'LG.jpg';

    if (currentOverlay) map.removeLayer(currentOverlay);
    markersGroup.clearLayers();

    // Set Denah Gambar
    currentOverlay = L.imageOverlay(imagePath, bounds).addTo(map);
    resetViewMap();

    // Reset Select Option Kunci
    const selectKunci = document.getElementById('select-kunci');
    selectKunci.innerHTML = '<option value="">Pilih via Peta / Dropdown</option>';

    // Filter Kunci Berdasarkan Lantai yang Dipilih
    const keysOnFloor = globalDataKunci.filter(k => String(k.lantai).trim().toUpperCase() === selectedFloor.toUpperCase());

    keysOnFloor.forEach(kunci => {
      // Masukkan ke dropdown
      const opt = document.createElement('option');
      opt.value = kunci.id || kunci.nama;
      opt.textContent = `\({kunci.id} -\){kunci.nama}`;
      selectKunci.appendChild(opt);

      // Cari koordinat atau default di tengah denah
      const coords = koordinatKunciMap[kunci.id] || koordinatKunciMap[kunci.nama] || [500, 700];
      const isAvailable = (kunci.status.toLowerCase() === 'tersedia');

      // Custom Ring Marker Dot
      const customIcon = L.divIcon({
        className: 'custom-marker',
        html: `<div class="marker-dot ${isAvailable ? '' : 'borrowed'}"></div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });

      const marker = L.marker(coords, { icon: customIcon });

      // PopUp Floating Card ala Voyager App
      const tooltipContent = `
        <div class="tooltip-card">
          <div class="tooltip-icon">🔑</div>
          <div>
            <div style="font-weight: 700;">${kunci.nama}</div>
            <div style="font-size: 11px; color: #6b7280;">Kode: ${kunci.id}</div>
            \({!isAvailable ? `<div style="font-size: 10px; color: #ef4444; margin-top: 2px;">Peminjam:\){kunci.peminjam}</div>` : ''}
            <span class="status-badge ${isAvailable ? 'status-available' : 'status-borrowed'}">
              ${isAvailable ? 'Tersedia' : 'Dipinjam'}
            </span>
          </div>
        </div>
      `;

      marker.bindTooltip(tooltipContent, {
        permanent: false,
        direction: 'top',
        offset: [0, -10],
        className: 'leaflet-tooltip-voyager'
      });

      // Event Klik Marker
      marker.on('click', () => {
        if (!isAvailable) {
          alert(`Kunci \({kunci.nama} (\){kunci.id}) sedang dipinjam oleh ${kunci.peminjam}!`);
          return;
        }
        if (kunci.zona) document.getElementById('select-zona').value = kunci.zona;
        document.getElementById('select-kunci').value = kunci.id || kunci.nama;
      });

      markersGroup.addLayer(marker);
    });
  }

  function resetViewMap() {
    map.fitBounds(bounds);
  }

  function toggleLoading(show) {
    document.getElementById('loading-indicator').style.display = show ? 'flex' : 'none';
  }

  function submitPilihanKunci() {
    const lantai = document.getElementById('select-lantai').value;
    const zona = document.getElementById('select-zona').value;
    const kunci = document.getElementById('select-kunci').value;

    if (!kunci) {
      alert('Silakan pilih kunci terlebih dahulu!');
      return;
    }

    // Redirect Kembali ke index.html membawa Parameter Terpilih
    window.location.href = `index.html?lantai=\({lantai}&zona=\){zona}&kunci=${encodeURIComponent(kunci)}`;
  }

  // Load Data Pertama Kali
  fetchSpreadsheetData();
</script>

</body>
</html>
