<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilih Lokasi Kunci - Denah Mall</title>
  
  <!-- Font Modern (Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #55e0e7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 1250px;
      display: flex;
      gap: 30px;
      align-items: stretch;
    }

    /* --- KOLOM KIRI (SIDEBAR FORM) --- */
    .sidebar {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 15px;
      padding: 10px;
      min-width: 300px;
    }

    .form-group {
      position: relative;
    }

    .select-pill, .btn-cari {
      width: 100%;
      padding: 16px 24px;
      border-radius: 50px;
      border: none;
      outline: none;
      font-size: 15px;
      font-weight: 600;
      color: #2d3748;
      background: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      appearance: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .select-pill:focus {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.6);
    }

    .select-wrapper {
      position: relative;
    }
    .select-wrapper::after {
      content: '▾';
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #718096;
      font-size: 16px;
    }

    .btn-cari {
      background: #b0b0b0;
      color: #ffffff;
      text-align: center;
      margin-top: 5px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .btn-cari:hover {
      background: #999999;
    }

    .back-link {
      color: #1a202c;
      text-decoration: none;
      font-size: 14px;
      margin-top: 10px;
      display: inline-block;
      font-weight: 500;
    }

    .back-link strong {
      font-weight: 700;
    }

    /* --- KOLOM KANAN (DENAH LAYOUT) --- */
    .map-wrapper {
      flex: 2.2;
      background: #ffffff;
      border-radius: 35px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    #map {
      width: 100%;
      height: 520px;
      background: #f8fafc;
      border-radius: 20px;
      z-index: 1;
    }

    .custom-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 15px;
      font-size: 20px;
      font-weight: 600;
      color: #2d3748;
    }

    .zoom-btn-group span {
      cursor: pointer;
      user-select: none;
      padding: 0 8px;
    }

    .btn-fit {
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    /* --- MARKER & TOOLTIP STYLES --- */
    .custom-marker {
      width: 16px;
      height: 16px;
      background: #ffffff;
      border: 4px solid #2d3748;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .custom-marker:hover {
      transform: scale(1.3);
      border-color: #2563eb;
    }
    .custom-marker.borrowed {
      border-color: #ef4444;
    }

    .leaflet-tooltip-custom {
      background: rgba(255, 255, 255, 0.9) !important;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.6) !important;
      border-radius: 20px !important;
      padding: 10px 18px !important;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1) !important;
      color: #1e293b !important;
      font-size: 13px !important;
      font-weight: 600 !important;
    }
    
    .leaflet-tooltip-custom::before {
      display: none;
    }

    .tooltip-tag {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tooltip-icon {
      width: 24px;
      height: 24px;
      background: #e2e8f0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .status-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 2px;
      display: inline-block;
    }
    .status-available { background: #dcfce7; color: #166534; }
    .status-borrowed { background: #fee2e2; color: #991b1b; }

    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.7);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      border-radius: 35px;
    }

    @media (max-width: 900px) {
      .app-container { flex-direction: column; }
      #map { height: 400px; }
    }
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- KOLOM KIRI (SIDEBAR INPUT) -->
  <div class="sidebar">
    <div class="form-group select-wrapper">
      <select id="select-lantai" class="select-pill" onchange="renderCurrentLantai()">
        <option value="LG" selected>Lantai : LG</option>
        <option value="L1">Lantai : L1</option>
        <option value="L2">Lantai : L2</option>
        <option value="L3">Lantai : L3</option>
        <option value="L4">Lantai : L4</option>
      </select>
    </div>

    <div class="form-group select-wrapper">
      <select id="select-zona" class="select-pill">
        <option value="A">Zona : A</option>
        <option value="B">Zona : B</option>
        <option value="C">Zona : C</option>
      </select>
    </div>

    <div class="form-group select-wrapper">
      <select id="select-kunci" class="select-pill">
        <option value="">Nomor Kunci : Pilih di Peta</option>
      </select>
    </div>

    <button class="btn-cari" onclick="submitPilihanKunci()">Cari</button>

    <div>
      <a href="index.html" class="back-link">Kembali ke <strong>form peminjaman kunci</strong></a>
    </div>
  </div>

  <!-- KOLOM KANAN (DENAH MALL) -->
  <div class="map-wrapper">
    <div id="loading-indicator" class="loading-overlay" style="display: none;">Memuat Data Kunci...</div>
    <div id="map"></div>
    
    <!-- Controls Zoom & Fit -->
    <div class="custom-controls">
      <div class="zoom-btn-group">
        <span onclick="map.zoomIn()">+</span>
        <span>|</span>
        <span onclick="map.zoomOut()">-</span>
      </div>
      <div class="btn-fit" onclick="resetViewMap()">Fit</div>
    </div>
  </div>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // =========================================================
  // 1. ISIKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
  // =========================================================
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx...AKAN_DISEUAIKAN.../exec";

  // Inisialisasi Map Leaflet
  const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -1,
    maxZoom: 2,
    zoomControl: false
  });

  const bounds = [[0, 0], [1000, 1400]];
  let currentOverlay = null;
  let markersGroup = L.layerGroup().addTo(map);

  // Mapping Gambar per Lantai
  const gambarDenahLantai = {
    'LG': 'LG.jpg',
    'L1': 'L1.jpg',
    'L2': 'L2.jpg',
    'L3': 'L3.jpg',
    'L4': 'L4.jpg'
  };

  // Titik Koordinat Default Marker (Bisa disesuaikan per ID Kunci)
  const koordinatKunciMap = {
    '3 - PINTU KACA': [480, 430],
    '4 - SELMA': [520, 780],
    '5 - AZKO': [660, 910],
    'L1-01': [400, 100],
    'L1-02': [700, 100]
  };

  let globalDataKunci = [];

  // 2. AMBIL DATA REALTIME DARI APPS SCRIPT
  async function fetchSpreadsheetData() {
    toggleLoading(true);
    try {
      const response = await fetch(`${WEB_APP_URL}?aksi=ambil_status_lengkap`);
      const data = await response.json();
      globalDataKunci = data;
      renderCurrentLantai();
    } catch (error) {
      console.error("Gagal mengambil data Spreadsheet:", error);
      alert("Gagal memuat data dari database spreadsheet.");
    } finally {
      toggleLoading(false);
    }
  }

  // 3. RENDER PETA & MARKER DARI DATA SPREADSHEET
  function renderCurrentLantai() {
    const selectedFloor = document.getElementById('select-lantai').value;
    const imagePath = gambarDenahLantai[selectedFloor] || 'LG.jpg';

    if (currentOverlay) map.removeLayer(currentOverlay);
    markersGroup.clearLayers();

    // Set Denah Gambar
    currentOverlay = L.imageOverlay(imagePath, bounds).addTo(map);
    resetViewMap();

    // Reset Dropdown Kunci
    const selectKunci = document.getElementById('select-kunci');
    selectKunci.innerHTML = '<option value="">Nomor Kunci : Pilih di Peta</option>';

    // Filter Kunci Berdasarkan Lantai Terpilih
    const keysOnFloor = globalDataKunci.filter(k => String(k.lantai).trim().toUpperCase() === selectedFloor.toUpperCase());

    keysOnFloor.forEach(kunci => {
      // Tambahkan Option ke Dropdown
      const opt = document.createElement('option');
      opt.value = kunci.id || kunci.nama;
      opt.textContent = `Nomor Kunci : \({kunci.id} (\){kunci.nama})`;
      selectKunci.appendChild(opt);

      // Cari Koordinat (jika ada, default center jika tidak ditemukan)
      const coords = koordinatKunciMap[kunci.id] || koordinatKunciMap[kunci.nama] || [500, 700];
      const isAvailable = (kunci.status.toLowerCase() === 'tersedia');

      // Style Icon Marker
      const customIcon = L.divIcon({
        className: `custom-marker ${isAvailable ? '' : 'borrowed'}`,
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });

      const marker = L.marker(coords, { icon: customIcon });

      // PopUp Detail saat Hover
      const tooltipContent = `
        <div class="tooltip-tag">
          <div class="tooltip-icon">🔑</div>
          <div>
            <div>${kunci.nama}</div>
            <div style="font-size: 11px; color: #64748b;">ID: ${kunci.id}</div>
            \({!isAvailable ? `<div style="font-size: 10px; color: #ef4444;">Peminjam:\){kunci.peminjam}</div>` : ''}
            <span class="status-badge ${isAvailable ? 'status-available' : 'status-borrowed'}">
              ${isAvailable ? '● Tersedia' : '● Dipinjam'}
            </span>
          </div>
        </div>
      `;

      marker.bindTooltip(tooltipContent, {
        permanent: false,
        direction: 'top',
        offset: [0, -10],
        className: 'leaflet-tooltip-custom'
      });

      // Event Click Marker
      marker.on('click', () => {
        if (!isAvailable) {
          alert(`Kunci \({kunci.nama} (\){kunci.id}) sedang dipinjam oleh ${kunci.peminjam}!`);
          return;
        }
        if (kunci.zona) document.getElementById('select-zona').value = kunci.zona;
        document.getElementById('select-kunci').value = kunci.id || kunci.nama;
      });

      markersGroup.addLayer(marker);
    });
  }

  function resetViewMap() {
    map.fitBounds(bounds);
  }

  function toggleLoading(show) {
    document.getElementById('loading-indicator').style.display = show ? 'flex' : 'none';
  }

  function submitPilihanKunci() {
    const lantai = document.getElementById('select-lantai').value;
    const zona = document.getElementById('select-zona').value;
    const kunci = document.getElementById('select-kunci').value;

    if (!kunci) {
      alert('Silakan pilih kunci terlebih dahulu!');
      return;
    }

    // Redirect Kembali ke index.html membawa Parameter Terpilih
    window.location.href = `index.html?lantai=\({lantai}&zona=\){zona}&kunci=${encodeURIComponent(kunci)}`;
  }

  // Panggil Fetch Data Pertama Kali Saat Halaman Dimuat
  fetchSpreadsheetData();
</script>

</body>
</html>
