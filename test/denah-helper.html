<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilih Lokasi Kunci - Denah Mall</title>
  
  <!-- Font Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --text-muted: #9ca3af;
      --primary-color: #375b4f;
    }

    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: 0;
    }

    .app-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1150px;
      background: #ffffff;
      border-radius: 40px;
      padding: 24px;
      display: flex;
      gap: 25px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
      align-items: stretch;
    }

    .sidebar {
      flex: 1.2;
      padding: 15px 10px 10px 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand-logo {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary-color);
      letter-spacing: -0.5px;
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 15px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 12px;
    }

    .filter-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .filter-row select {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #E2E8F0;
      outline: none;
      font-size: 13px;
      font-weight: 600;
      color: #0d9488;
      background: #f8fafc;
      cursor: pointer;
    }

    .search-box {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #E2E8F0;
      outline: none;
      font-size: 13px;
      color: #374151;
      background: #ffffff;
      margin-bottom: 12px;
    }

    .key-item {
      display: flex;
      align-items: center;
      padding: 8px 6px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    .key-item:last-child { border-bottom: none; }

    .key-item input[type="checkbox"] {
      margin-right: 10px;
      width: 16px;
      height: 16px;
      accent-color: var(--primary-color);
      cursor: pointer;
    }

    .key-label {
      font-weight: 700;
      color: #1f2937;
    }

    .key-tag {
      font-weight: 500;
      color: var(--text-muted);
      font-size: 12px;
      margin-left: auto;
    }

    .key-item.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      border-radius: 50px;
      border: none;
      background: var(--primary-color);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 10px 20px rgba(55, 91, 79, 0.25);
    }

    .footer-link {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: #6b7280;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-link a {
      color: #111827;
      font-weight: 700;
      text-decoration: none;
    }

    .admin-toggle-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
    }

    .admin-toggle-btn.active {
      background: #ef4444;
      color: #ffffff;
      border-color: #dc2626;
    }

    .map-wrapper {
      flex: 1.5;
      border-radius: 32px;
      overflow: hidden;
      position: relative;
      min-height: 520px;
      background: #f1f5f9;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 520px;
      background: #f1f5f9;
      z-index: 1;
    }

    .custom-marker { position: relative; }

    .marker-dot {
      width: 18px;
      height: 18px;
      background: #ffffff;
      border: 3px solid var(--primary-color);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(0,0,0,0.35);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .custom-marker:hover .marker-dot, .marker-dot.selected {
      transform: scale(1.35);
      background: var(--primary-color);
    }

    .marker-dot.borrowed { border-color: #ef4444; }

    /* Indikator visual ketika mode admin aktif */
    .marker-dot.admin-draggable {
      border-color: #f59e0b !important;
      background: #fbbf24 !important;
      cursor: move !important;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.9) !important;
    }

    .leaflet-tooltip-voyager {
      background: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(12px) !important;
      border: 1px solid rgba(255, 255, 255, 0.7) !important;
      border-radius: 20px !important;
      padding: 10px 16px !important;
      color: #111827 !important;
      font-size: 13px !important;
    }
  </style>
</head>
<body>

<div class="app-card">
  
  <!-- SIDEBAR FORM -->
  <div class="sidebar">
    <div>
      <div class="brand-logo">keymanager</div>

      <div class="form-group">
        <label>Pilih Kunci / Ruangan:</label>
        <div class="filter-row">
          <select id="filterLantai" onchange="gantiLantai()">
            <option value="">All Floor</option>
          </select>
          <select id="filterZona" onchange="saringKunci()">
            <option value="">All Zone</option>
          </select>
        </div>
        <input type="text" id="kotakCari" class="search-box" onkeyup="saringKunci()" placeholder="🔍 Ketik nama ruangan / ID kunci...">
        <div id="kontainerKunciChecklist" style="max-height: 200px; overflow-y: auto; border: 1px solid #E2E8F0; border-radius: 8px; padding: 10px; background: #fff;">
          <p style="color: var(--text-muted); font-size: 13px; margin: 0;">Memuat data kunci...</p>
        </div>
      </div>

      <button class="btn-submit" onclick="submitPilihanKunci()">Pilih Kunci Ini</button>
    </div>

    <div class="footer-link">
      <span>Kembali ke <a href="index.html">Form Peminjaman</a></span>
      <button class="admin-toggle-btn" id="btnAdminToggle" onclick="toggleAdminMode()">🔓 Mode Admin</button>
    </div>
  </div>

  <!-- CONTAINER PETA -->
  <div class="map-wrapper">
    <div id="map"></div>
  </div>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxGoHYvbAnvd3IjS1eQrUUiChTY--AFqCzQoTHtfg97k5hreaTqEnruiF5MmaqqXFyrQA/exec";
  const PASSWORD_ADMIN = "admin123";

  const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -2,
    maxZoom: 2,
    zoomControl: false
  });

  let currentOverlay = null;
  let currentFloorLoaded = null;
  let activeImageBounds = [[0, 0], [1000, 1400]];
  let markersGroup = L.layerGroup().addTo(map);

  const gambarDenahLantai = {
    'LG': './LG.jpg',
    'L1': './L1.jpg',
    'L2': './L2.jpg',
    'L3': './L3.jpg',
    'L4': './L4.jpg'
  };

  const koordinatKunciMap = {
    '1': [480, 300],
    '2': [500, 450],
    '3': [520, 600],
    '4': [550, 750],
    '5': [600, 900],
    '6': [650, 1050]
  };

  let globalDataKunci = [];
  let selectedKeyIds = new Set();
  let isAdminMode = false;

  function toggleAdminMode() {
    if (!isAdminMode) {
      const pass = prompt("Masukkan Kata Sandi Admin untuk menggeser Pin:");
      if (pass === PASSWORD_ADMIN) {
        isAdminMode = true;
        const btn = document.getElementById('btnAdminToggle');
        btn.classList.add('active');
        btn.innerHTML = '🔒 Mode Admin (Aktif)';
        alert("Mode Admin Aktif!\n\nSekarang Anda dapat menahan & geser (drag) titik pin di peta.\nKoordinat baru akan otomatis disalin ke Clipboard.");
        saringKunci();
      } else if (pass !== null) {
        alert("Kata sandi salah!");
      }
    } else {
      isAdminMode = false;
      const btn = document.getElementById('btnAdminToggle');
      btn.classList.remove('active');
      btn.innerHTML = '🔓 Mode Admin';
      saringKunci();
    }
  }

  async function fetchSpreadsheetData() {
    try {
      const response = await fetch(WEB_APP_URL + "?aksi=ambil_status_lengkap");
      const data = await response.json();
      
      if (Array.isArray(data)) {
        globalDataKunci = data;
        isiOptionFilter(data);
      } else {
        globalDataKunci = [];
      }
      gantiLantai();
    } catch (error) {
      console.error("Gagal mengambil data:", error);
      document.getElementById('kontainerKunciChecklist').innerHTML = '<p style="color: red; font-size: 13px;">Gagal memuat data.</p>';
    }
  }

  function isiOptionFilter(data) {
    const selLantai = document.getElementById('filterLantai');
    const selZona = document.getElementById('filterZona');
    
    const lantaiList = [...new Set(data.map(function(k) { return k.lantai; }).filter(Boolean))];
    const zonaList = [...new Set(data.map(function(k) { return k.zona; }).filter(Boolean))];

    selLantai.innerHTML = '<option value="">All Floor</option>';
    lantaiList.forEach(function(l) {
      selLantai.innerHTML += '<option value="' + l + '">Lantai ' + l + '</option>';
    });

    selZona.innerHTML = '<option value="">All Zone</option>';
    zonaList.forEach(function(z) {
      selZona.innerHTML += '<option value="' + z + '">Zone ' + z + '</option>';
    });
  }

  function gantiLantai() {
    const selectedFloor = document.getElementById('filterLantai').value || 'LG';
    if (currentFloorLoaded !== selectedFloor) {
      renderMapOverlay(selectedFloor);
      currentFloorLoaded = selectedFloor;
    }
    saringKunci();
  }

  function saringKunci() {
    const selectedFloor = document.getElementById('filterLantai').value;
    const selectedZone = document.getElementById('filterZona').value;
    const searchQuery = document.getElementById('kotakCari').value.toLowerCase().trim();

    markersGroup.clearLayers();

    const container = document.getElementById('kontainerKunciChecklist');
    container.innerHTML = '';

    const filteredKeys = globalDataKunci.filter(function(k) {
      const matchFloor = (!selectedFloor) || (String(k.lantai || '').toUpperCase() === selectedFloor.toUpperCase());
      const matchZone = (!selectedZone) || (String(k.zona || '').toUpperCase() === selectedZone.toUpperCase());
      const keyText = ((k.id || '') + ' ' + (k.nama || '')).toLowerCase();
      const matchSearch = keyText.includes(searchQuery);

      return matchFloor && matchZone && matchSearch;
    });

    if (filteredKeys.length === 0) {
      container.innerHTML = '<p style="color: var(--text-muted); font-size: 13px; margin: 0;">Kunci tidak ditemukan</p>';
      return;
    }

    filteredKeys.forEach(function(kunci, index) {
      const keyId = kunci.id || kunci.nama;
      const isAvailable = String(kunci.status || 'Tersedia').toLowerCase() === 'tersedia';
      const isChecked = selectedKeyIds.has(keyId);

      const itemEl = document.createElement('div');
      itemEl.className = 'key-item ' + (isAvailable ? '' : 'disabled');
      
      const labelTeks = (kunci.id ? kunci.id + ' - ' : '') + kunci.nama;
      const tagTeks = '[Lantai ' + (kunci.lantai || '-') + ' - ' + (kunci.zona || '-') + ']';

      itemEl.innerHTML = 
        '<input type="checkbox" id="chk-' + keyId + '" value="' + keyId + '" ' + (isChecked ? 'checked' : '') + ' ' + (isAvailable ? '' : 'disabled') + '>' +
        '<label for="chk-' + keyId + '" style="cursor: pointer; width: 100%; display: flex; align-items: center;">' +
          '<span class="key-label">' + labelTeks + '</span>' +
          '<span class="key-tag">' + tagTeks + '</span>' +
        '</label>';

      const checkbox = itemEl.querySelector('input');
      checkbox.addEventListener('change', function(e) {
        if (e.target.checked) {
          selectedKeyIds.add(keyId);
        } else {
          selectedKeyIds.delete(keyId);
        }
        saringKunci();
      });

      container.appendChild(itemEl);

      const currentFloorMap = selectedFloor || 'LG';
      if (String(kunci.lantai || '').toUpperCase() === currentFloorMap.toUpperCase()) {
        let coords = koordinatKunciMap[keyId] || koordinatKunciMap[kunci.id] || koordinatKunciMap[kunci.nama];
        if (!coords) {
          coords = [500 + (index * 20), 400 + (index * 30)];
        }

        const customIcon = L.divIcon({
          className: 'custom-marker',
          html: '<div class="marker-dot ' + (isAvailable ? '' : 'borrowed') + ' ' + (isChecked ? 'selected' : '') + ' ' + (isAdminMode ? 'admin-draggable' : '') + '"></div>',
          iconSize: [18, 18],
          iconAnchor: [9, 9]
        });

        const marker = L.marker(coords, { 
          icon: customIcon,
          draggable: isAdminMode
        });

        if (isAdminMode) {
          marker.on('dragend', function(e) {
            const newLatLng = e.target.getLatLng();
            const newY = Math.round(newLatLng.lat);
            const newX = Math.round(newLatLng.lng);
            const formattedCoords = '[' + newY + ', ' + newX + ']';

            koordinatKunciMap[keyId] = [newY, newX];
            
            const copyText = "'" + keyId + "': " + formattedCoords + ",";
            if (navigator.clipboard) {
              navigator.clipboard.writeText(copyText);
            }
            
            console.log("Koordinat Baru (" + keyId + "):", copyText);
            alert("Koordinat Baru (" + kunci.nama + "):\n" + copyText + "\n\n(Telah otomatis disalin ke Clipboard!)");
          });
        }

        marker.bindTooltip('<b>' + kunci.nama + '</b><br>Status: ' + (kunci.status || 'Tersedia') + (isAdminMode ? '<br><i style="color:#d97706">[Tahan & Geser Pin Ini]</i>' : ''), {
          direction: 'top',
          className: 'leaflet-tooltip-voyager'
        });

        marker.on('click', function() {
          if (isAdminMode) return;
          if (!isAvailable) return;
          if (selectedKeyIds.has(keyId)) {
            selectedKeyIds.delete(keyId);
          } else {
            selectedKeyIds.add(keyId);
          }
          saringKunci();
        });

        markersGroup.addLayer(marker);
      }
    });
  }

  function renderMapOverlay(selectedFloor) {
    const imagePath = gambarDenahLantai[selectedFloor] || './LG.jpg';
    if (currentOverlay) map.removeLayer(currentOverlay);

    const img = new Image();
    img.src = imagePath;
    img.onload = function() {
      activeImageBounds = [[0, 0], [this.height || 1000, this.width || 1400]];
      currentOverlay = L.imageOverlay(imagePath, activeImageBounds).addTo(map);
      map.fitBounds(activeImageBounds);
    };
    img.onerror = function() {
      activeImageBounds = [[0, 0], [1000, 1400]];
      currentOverlay = L.imageOverlay(imagePath, activeImageBounds).addTo(map);
      map.fitBounds(activeImageBounds);
    };
  }

  function submitPilihanKunci() {
    const keysArray = Array.from(selectedKeyIds);
    if (keysArray.length === 0) {
      alert('Silakan pilih minimal satu kunci!');
      return;
    }
    window.location.href = 'index.html?kunci=' + encodeURIComponent(keysArray.join(','));
  }

  fetchSpreadsheetData();
</script>
</body>
</html>
