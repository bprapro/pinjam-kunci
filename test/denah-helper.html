<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilih Lokasi Kunci - Denah Mall</title>
  
  <!-- Font Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --text-muted: #9ca3af;
      --primary-color: #375b4f;
    }

    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: 0;
    }

    .app-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1150px;
      background: #ffffff;
      border-radius: 40px;
      padding: 24px;
      display: flex;
      gap: 25px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
      align-items: stretch;
    }

    .sidebar {
      flex: 1.2;
      padding: 15px 10px 10px 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand-logo {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary-color);
      letter-spacing: -0.5px;
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 15px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 12px;
    }

    .filter-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .filter-row select {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #E2E8F0;
      outline: none;
      font-size: 13px;
      font-weight: 600;
      color: #0d9488;
      background: #f8fafc;
      cursor: pointer;
    }

    .search-box {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #E2E8F0;
      outline: none;
      font-size: 13px;
      color: #374151;
      background: #ffffff;
      margin-bottom: 12px;
    }

    .key-item {
      display: flex;
      align-items: center;
      padding: 8px 6px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    .key-item:last-child { border-bottom: none; }

    .key-item input[type="checkbox"] {
      margin-right: 10px;
      width: 16px;
      height: 16px;
      accent-color: var(--primary-color);
      cursor: pointer;
    }

    .key-label {
      font-weight: 700;
      color: #1f2937;
    }

    .key-tag {
      font-weight: 500;
      color: var(--text-muted);
      font-size: 12px;
      margin-left: auto;
    }

    .btn-manual-set {
      margin-left: 8px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .key-item.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      border-radius: 50px;
      border: none;
      background: var(--primary-color);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 10px 20px rgba(55, 91, 79, 0.25);
    }

    .footer-link {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: #6b7280;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-link a {
      color: #111827;
      font-weight: 700;
      text-decoration: none;
    }

    .admin-toggle-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
    }

    .admin-toggle-btn.active {
      background: #ef4444;
      color: #ffffff;
      border-color: #dc2626;
    }

    .map-wrapper {
      flex: 1.5;
      border-radius: 32px;
      overflow: hidden;
      position: relative;
      min-height: 520px;
      background: #f1f5f9;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 520px;
      background: #f1f5f9;
      z-index: 1;
    }

    .custom-marker { position: relative; }

    .marker-dot {
      width: 18px;
      height: 18px;
      background: #ffffff;
      border: 3px solid var(--primary-color);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(0,0,0,0.35);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .custom-marker:hover .marker-dot, .marker-dot.selected {
      transform: scale(1.35);
      background: var(--primary-color);
    }

    .marker-dot.borrowed { border-color: #ef4444; }

    .marker-dot.admin-draggable {
      border-color: #f59e0b !important;
      background: #fbbf24 !important;
      cursor: move !important;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.9) !important;
    }

    .leaflet-tooltip-voyager {
      background: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(12px) !important;
      border: 1px solid rgba(255, 255, 255, 0.7) !important;
      border-radius: 20px !important;
      padding: 10px 16px !important;
      color: #111827 !important;
      font-size: 13px !important;
    }

    .admin-banner {
      display: none;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    /* Style Khusus Popup Dropdown Admin */
    .popup-admin-container {
      min-width: 200px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .popup-admin-container select {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 12px;
      margin-top: 6px;
      margin-bottom: 8px;
    }

    .popup-admin-container button {
      width: 100%;
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 6px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app-card">
  
  <!-- SIDEBAR FORM -->

    <div>
      <div class="brand-logo">keymanager</div>

      <div id="adminBanner" class="admin-banner">
        ⚡ Mode Admin: Klik pada Denah untuk memunculkan Dropdown Kunci &amp; Pasang Pin.
      </div>

      <div class="form-group">

          </select>
        </div>
        <input type="text" id="kotakCari" class="search-box" onkeyup="saringKunci()" placeholder="🔍 Ketik nama ruangan / ID kunci...">
