<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilih Lokasi Kunci - Denah Mall</title>
  
  <!-- Font Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --text-muted: #9ca3af;
      --primary-color: #375b4f;
    }

    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: 0;
    }

    .app-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1150px;
      background: #ffffff;
      border-radius: 40px;
      padding: 24px;
      display: flex;
      gap: 25px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
      align-items: stretch;
    }

    .sidebar {
      flex: 1.2;
      padding: 15px 10px 10px 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand-logo {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary-color);
      letter-spacing: -0.5px;
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 15px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 12px;
    }

    .filter-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .filter-row select {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #E2E8F0;
      outline: none;
      font-size: 13px;
      font-weight: 600;
      color: #0d9488;
      background: #f8fafc;
      cursor: pointer;
    }

    .search-box {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #E2E8F0;
      outline: none;
      font-size: 13px;
      color: #374151;
      background: #ffffff;
      margin-bottom: 12px;
    }

    .key-item {
      display: flex;
      align-items: center;
      padding: 8px 6px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    .key-item:last-child { border-bottom: none; }

    .key-item input[type="checkbox"] {
      margin-right: 10px;
      width: 16px;
      height: 16px;
      accent-color: var(--primary-color);
      cursor: pointer;
    }

    .key-label {
      font-weight: 700;
      color: #1f2937;
    }

    .key-tag {
      font-weight: 500;
      color: var(--text-muted);
      font-size: 12px;
      margin-left: auto;
    }

    .btn-manual-set {
      margin-left: 8px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .key-item.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      border-radius: 50px;
      border: none;
      background: var(--primary-color);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 10px 20px rgba(55, 91, 79, 0.25);
    }

    .footer-link {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: #6b7280;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-link a {
      color: #111827;
      font-weight: 700;
      text-decoration: none;
    }

    .admin-toggle-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
    }

    .admin-toggle-btn.active {
      background: #ef4444;
      color: #ffffff;
      border-color: #dc2626;
    }

    .map-wrapper {
      flex: 1.5;
      border-radius: 32px;
      overflow: hidden;
      position: relative;
      min-height: 520px;
      background: #f1f5f9;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 520px;
      background: #f1f5f9;
      z-index: 1;
    }

    .custom-marker { position: relative; }

    .marker-dot {
      width: 18px;
      height: 18px;
      background: #ffffff;
      border: 3px solid var(--primary-color);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(0,0,0,0.35);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .custom-marker:hover .marker-dot, .marker-dot.selected {
      transform: scale(1.35);
      background: var(--primary-color);
    }

    .marker-dot.borrowed { border-color: #ef4444; }

    .marker-dot.admin-draggable {
      border-color: #f59e0b !important;
      background: #fbbf24 !important;
      cursor: move !important;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.9) !important;
    }

    .leaflet-tooltip-voyager {
      background: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(12px) !important;
      border: 1px solid rgba(255, 255, 255, 0.7) !important;
      border-radius: 20px !important;
      padding: 10px 16px !important;
      color: #111827 !important;
      font-size: 13px !important;
    }

    .admin-banner {
      display: none;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #92400e;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .popup-admin-container {
      min-width: 200px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .popup-admin-container select {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 12px;
      margin-top: 6px;
      margin-bottom: 8px;
    }

    .popup-admin-container button {
      width: 100%;
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 6px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    /* ... CSS lain ... */

    .leaflet-marker-pane {
      z-index: 600 !important;
    }

    .custom-marker {
      position: relative;
      z-index: 1000 !important;
    }

    .marker-dot {
      width: 20px;
      height: 20px;
      background: #ffffff;
      border: 3px solid #375b4f;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.2s ease;
    }
   /* Kunci container marker Leaflet */
  .custom-marker {
    display: block !important;
    width: 18px !important;
    height: 18px !important;
  }

  /* Styling lingkaran pin */
  .marker-dot {
    width: 18px;
    height: 18px;
    background-color: #ef4444; /* Warna merah default */
    border: 2px solid #ffffff;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    box-sizing: border-box;
    cursor: pointer;
    transition: transform 0.2s ease, background-color 0.2s ease;
  }

  /* Pin saat kunci sedang terpinjam */
  .marker-dot.borrowed {
    background-color: #94a3b8; /* Warna abu-abu */
  }

  /* Pin saat diklik/terpilih */
  .marker-dot.selected {
    background-color: #22c55e; /* Warna hijau */
    transform: scale(1.3);
  }
  /* Indikator pin yang terpilih/tercentang */
  .marker-dot.selected {
    background-color: #22c55e; /* Warna hijau */
    transform: translate(-50%, -50%) scale(1.3);
  }
  </style>
</head>
<body>

<div class="app-card">
  
  <!-- SIDEBAR FORM -->
  <div class="sidebar">
    <div>
      <div class="brand-logo">keymanager</div>

      <div id="adminBanner" class="admin-banner">
        ⚡ Mode Admin: Klik pada Denah untuk memunculkan Dropdown Kunci &amp; Pasang Pin.
      </div>

      <div class="form-group">
        <label>Pilih Kunci / Ruangan:</label>
        <div class="filter-row">
          <select id="filterLantai" onchange="gantiLantai()"></select>
          <select id="filterZona" onchange="saringKunci()">
            <option value="">All Zone</option>
          </select>
        </div>
        <input type="text" id="kotakCari" class="search-box" onkeyup="saringKunci()" placeholder="🔍 Ketik nama ruangan / ID kunci...">
        <div id="kontainerKunciChecklist" style="max-height: 220px; overflow-y: auto; border: 1px solid #E2E8F0; border-radius: 8px; padding: 10px; background: #fff;">
          <p style="color: var(--text-muted); font-size: 13px; margin: 0;">Memuat data kunci...</p>
        </div>
      </div>

      <button class="btn-submit" onclick="submitPilihanKunci()">Pilih Kunci Ini</button>
    </div>

    <div class="footer-link">
      <span>Kembali ke <a href="index.html">Form Peminjaman</a></span>
      <button class="admin-toggle-btn" id="btnAdminToggle" onclick="toggleAdminMode()">🔓 Mode Admin</button>
    </div>
  </div>

  <!-- CONTAINER PETA -->
  <div class="map-wrapper">
    <div id="map"></div>
  </div>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxGoHYvbAnvd3IjS1eQrUUiChTY--AFqCzQoTHtfg97k5hreaTqEnruiF5MmaqqXFyrQA/exec";
  const PASSWORD_ADMIN = "admin123";

  const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -3,
    maxZoom: 3,
    zoomControl: false
  });

  let currentOverlay = null;
  let currentFloorLoaded = null;
  let activeImageBounds = [[0, 0], [2000, 2000]];
  let markersGroup = L.layerGroup().addTo(map);

  const gambarDenahLantai = {
    'LG': './LG.jpg',
    'L1': './L1.jpg',
    'L2': './L2.jpg',
    'L3': './L3.jpg',
    'L4': './L4.jpg'
  };

  let globalDataKunci = [];
  let selectedKeyIds = new Set();
  let isAdminMode = false;

  function toggleAdminMode() {
    if (!isAdminMode) {
      const pass = prompt("Masukkan Kata Sandi Admin:");
      if (pass === PASSWORD_ADMIN) {
        isAdminMode = true;
        document.getElementById('btnAdminToggle').classList.add('active');
        document.getElementById('btnAdminToggle').innerHTML = '🔒 Mode Admin (Aktif)';
        document.getElementById('adminBanner').style.display = 'block';
        saringKunci();
      } else if (pass !== null) {
        alert("Kata sandi salah!");
      }
    } else {
      isAdminMode = false;
      document.getElementById('btnAdminToggle').classList.remove('active');
      document.getElementById('btnAdminToggle').innerHTML = '🔓 Mode Admin';
      document.getElementById('adminBanner').style.display = 'none';
      saringKunci();
    }
  }

  // Klik Admin pada Peta
  map.on('click', function(e) {
    if (!isAdminMode) return;

    const clickY = Math.round(e.latlng.lat);
    const clickX = Math.round(e.latlng.lng);
    const selectedFloor = document.getElementById('filterLantai').value || 'LG';

    const keysOnCurrentFloor = globalDataKunci.filter(function(k) {
      return String(k.lantai || '').toUpperCase() === selectedFloor.toUpperCase();
    });

    if (keysOnCurrentFloor.length === 0) {
      alert("Tidak ada daftar kunci pada lantai " + selectedFloor);
      return;
    }

    let optionHtml = '';
    keysOnCurrentFloor.forEach(function(k) {
      const idKey = k.id || k.nama;
      const label = (k.id ? k.id + ' - ' : '') + k.nama;
      const sudahAdaPin = k.koordinat ? ' 📍' : '';
      optionHtml += '<option value="' + idKey + '">' + label + sudahAdaPin + '</option>';
    });

    const popupContent = 
      '<div class="popup-admin-container">' +
        '<strong style="font-size: 13px; color: #0f172a;">📍 Pasang Pin di Koordinat:</strong><br>' +
        '<small style="color:#64748b;">Y: ' + clickY + ', X: ' + clickX + ' (Lantai ' + selectedFloor + ')</small><br>' +
        '<select id="adminSelectKeyPopup">' + optionHtml + '</select>' +
        '<button onclick="eksekusiSimpanPinPopup(' + clickY + ',' + clickX + ')">Simpan Pin Kunci</button>' +
      '</div>';

    L.popup()
      .setLatLng(e.latlng)
      .setContent(popupContent)
      .openOn(map);
  });

  window.eksekusiSimpanPinPopup = function(y, x) {
    const selectEl = document.getElementById('adminSelectKeyPopup');
    if (!selectEl) return;
    const keyIdSelected = selectEl.value;
    if (keyIdSelected) {
      map.closePopup();
      simpanKoordinatKeDatabase(keyIdSelected, y + ',' + x);
    }
  };

  async function fetchSpreadsheetData() {
    try {
      const response = await fetch(WEB_APP_URL + "?aksi=ambil_status_lengkap");
      const data = await response.json();
      
      if (Array.isArray(data)) {
        globalDataKunci = data;
        isiOptionFilter(data);
      } else {
        globalDataKunci = [];
      }
      gantiLantai();
    } catch (error) {
      console.error("Gagal mengambil data:", error);
      document.getElementById('kontainerKunciChecklist').innerHTML = '<p style="color: red; font-size: 13px;">Gagal memuat data.</p>';
    }
  }

  function isiOptionFilter(data) {
    const selLantai = document.getElementById('filterLantai');
    const selZona = document.getElementById('filterZona');
    
    const daftarLantaiUrut = ['LG', 'L1', 'L2', 'L3', 'L4'];
    const lantaiSpreasheet = [...new Set(data.map(function(k) { return String(k.lantai || '').toUpperCase(); }).filter(Boolean))];
    
    const lantaiList = daftarLantaiUrut.filter(function(l) { return lantaiSpreasheet.includes(l); });
    if (lantaiList.length === 0) {
      lantaiSpreasheet.forEach(function(l) { lantaiList.push(l); });
    }

    const zonaList = [...new Set(data.map(function(k) { return k.zona; }).filter(Boolean))];

    if (selLantai.options.length === 0) {
      selLantai.innerHTML = '';
      lantaiList.forEach(function(l) {
        selLantai.innerHTML += '<option value="' + l + '">Lantai ' + l + '</option>';
      });
    }

    selZona.innerHTML = '<option value="">All Zone</option>';
    zonaList.forEach(function(z) {
      selZona.innerHTML += '<option value="' + z + '">Zone ' + z + '</option>';
    });
  }

  function gantiLantai() {
    const selLantai = document.getElementById('filterLantai');
    const selectedFloor = selLantai.value || 'LG';
    if (currentFloorLoaded !== selectedFloor) {
      renderMapOverlay(selectedFloor);
      currentFloorLoaded = selectedFloor;
    } else {
      saringKunci();
    }
  }

  function saringKunci() {
    const selectedFloor = document.getElementById('filterLantai').value || 'LG';
    const selectedZone = document.getElementById('filterZona').value;
    const searchQuery = document.getElementById('kotakCari').value.toLowerCase().trim();

    markersGroup.clearLayers();
    const container = document.getElementById('kontainerKunciChecklist');
    container.innerHTML = '';

    const filteredKeys = globalDataKunci.filter(function(k) {
      const matchFloor = (String(k.lantai || '').toUpperCase() === selectedFloor.toUpperCase());
      const matchZone = (!selectedZone) || (String(k.zona || '').toUpperCase() === selectedZone.toUpperCase());
      const keyText = ((k.id || '') + ' ' + (k.nama || '')).toLowerCase();
      const matchSearch = keyText.includes(searchQuery);

      return matchFloor && matchZone && matchSearch;
    });

    if (filteredKeys.length === 0) {
      container.innerHTML = '<p style="color: var(--text-muted); font-size: 13px; margin: 0;">Kunci tidak ditemukan di lantai ini</p>';
      return;
    }

    filteredKeys.forEach(function(kunci) {
      const keyId = kunci.id || kunci.nama;
      const isAvailable = String(kunci.status || 'Tersedia').toLowerCase() === 'tersedia';
      const isChecked = selectedKeyIds.has(keyId);

      const itemEl = document.createElement('div');
      itemEl.className = 'key-item ' + (isAvailable ? '' : 'disabled');
      
      const labelTeks = (kunci.id ? kunci.id + ' - ' : '') + kunci.nama;
      const tagTeks = '[Lantai ' + (kunci.lantai || '-') + ' - ' + (kunci.zona || '-') + ']';

      let adminInsertBtn = '';
      if (isAdminMode) {
        adminInsertBtn = '<button class="btn-manual-set" onclick="inputManualPin(\'' + keyId + '\', \'' + kunci.nama + '\')">📌 Insert Pin</button>';
      }

      itemEl.innerHTML = 
        '<input type="checkbox" id="chk-' + keyId + '" value="' + keyId + '" ' + (isChecked ? 'checked' : '') + ' ' + (isAvailable ? '' : 'disabled') + '>' +
        '<label for="chk-' + keyId + '" style="cursor: pointer; width: 100%; display: flex; align-items: center;">' +
          '<span class="key-label">' + labelTeks + '</span>' +
          '<span class="key-tag">' + tagTeks + '</span>' +
        '</label>' +
        adminInsertBtn;

      const checkbox = itemEl.querySelector('input');
      checkbox.addEventListener('change', function(e) {
        if (e.target.checked) selectedKeyIds.add(keyId);
        else selectedKeyIds.delete(keyId);
        saringKunci();
      });

      container.appendChild(itemEl);

      // --- PEMBACAAN KOORDINAT YANG DIPERBAIKI ---
      if (kunci.koordinat && String(kunci.koordinat).trim() !== '') {
        let coordStr = String(kunci.koordinat).trim();
        let rawCoords = [];

        if (coordStr.includes(',')) {
          rawCoords = coordStr.split(',').map(function(n) { return parseFloat(n.trim()); });
        } else if (coordStr.length >= 6) {
          // Antisipasi jika terformat sebagai angka tunggal (misal 18901020 -> Y:1890, X:1020)
          const mid = Math.floor(coordStr.length / 2);
          rawCoords = [
            parseFloat(coordStr.substring(0, mid)),
            parseFloat(coordStr.substring(mid))
          ];
        }

        if (rawCoords.length === 2 && !isNaN(rawCoords[0]) && !isNaN(rawCoords[1])) {
          const coords = [rawCoords[0], rawCoords[1]];

        const customIcon = L.divIcon({
    className: 'custom-marker',
    html: '<div class="marker-dot ' + (isAvailable ? '' : 'borrowed') + ' ' + (isChecked ? 'selected' : '') + '"></div>',
    iconSize: [18, 18],     // Ukuran fisik marker 18x18 piksel
    iconAnchor: [9, 9]      // Titik jangkar terkunci tepat di tengah (setengah dari 18)
  });

  const marker = L.marker(coords, { 
    icon: customIcon,
    draggable: isAdminMode
  });

          if (isAdminMode) {
            marker.on('dragend', function(e) {
              const newLatLng = e.target.getLatLng();
              const newY = Math.round(newLatLng.lat);
              const newX = Math.round(newLatLng.lng);
              simpanKoordinatKeDatabase(keyId, newY + ',' + newX);
            });
          }

          marker.bindTooltip('<b>' + kunci.nama + '</b><br>Status: ' + (kunci.status || 'Tersedia') + (isAdminMode ? '<br><i style="color:#d97706">[Geser Pin Ini]</i>' : ''), {
            direction: 'top',
            className: 'leaflet-tooltip-voyager'
          });

          marker.on('click', function() {
            if (isAdminMode) return;
            if (!isAvailable) return;
            if (selectedKeyIds.has(keyId)) selectedKeyIds.delete(keyId);
            else selectedKeyIds.add(keyId);
            saringKunci();
          });

          markersGroup.addLayer(marker);
        }
      }
    });
  }

  function inputManualPin(id, nama) {
    const defaultCoords = "500,700";
    const inputVal = prompt("Masukkan Koordinat (Y, X) untuk [" + nama + "]:\n(Format: angka_Y, angka_X)", defaultCoords);
    if (inputVal) {
      simpanKoordinatKeDatabase(id, inputVal.trim());
    }
  }

  function simpanKoordinatKeDatabase(keyId, strKoordinat) {
  fetch(WEB_APP_URL, {
    method: 'POST',
    body: JSON.stringify({
      aksi: 'simpan_koordinat',
      id: keyId,
      koordinat: strKoordinat
    })
  })
  .then(function(res) { return res.json(); })
  .then(function(res) {
    if (res.status === 'success') {
      alert("✅ Koordinat untuk [" + keyId + "] berhasil disimpan: (" + strKoordinat + ")");
      
      // Update data di memori lokal secara langsung agar pin langsung muncul
      const item = globalDataKunci.find(function(k) { 
        return String(k.id || k.nama) === String(keyId); 
      });
      if (item) {
        item.koordinat = strKoordinat;
      }
      
      // Render ulang daftar & pin peta
      saringKunci();
    } else {
      alert("❌ Gagal menyimpan: " + res.message);
    }
  })
  .catch(function(err) {
    console.error(err);
    alert("❌ Terjadi kesalahan jaringan saat menyimpan koordinat.");
  });
}

  function renderMapOverlay(selectedFloor) {
    const imagePath = gambarDenahLantai[selectedFloor] || './LG.jpg';
    if (currentOverlay) map.removeLayer(currentOverlay);

    const img = new Image();
    img.src = imagePath;
    img.onload = function() {
      // Mengatur Bounds dinamis sesuai tinggi dan lebar asli dari gambar denah
      activeImageBounds = [[0, 0], [this.naturalHeight || 1000, this.naturalWidth || 1400]];
      currentOverlay = L.imageOverlay(imagePath, activeImageBounds).addTo(map);
      map.fitBounds(activeImageBounds);
      map.setMaxBounds(activeImageBounds);
      saringKunci();
    };
    img.onerror = function() {
      activeImageBounds = [[0, 0], [1000, 1400]];
      currentOverlay = L.imageOverlay(imagePath, activeImageBounds).addTo(map);
      map.fitBounds(activeImageBounds);
      saringKunci();
    };
  }

  function submitPilihanKunci() {
    const keysArray = Array.from(selectedKeyIds);
    if (keysArray.length === 0) {
      alert('Silakan pilih minimal satu kunci!');
      return;
    }
    window.location.href = 'index.html?kunci=' + encodeURIComponent(keysArray.join(','));
  }

  fetchSpreadsheetData();
  let activePopupLatLng = null;

  // Dipanggil saat denah peta diklik pada Mode Admin
  function bukaPopupPasangPin(latlng) {
    activePopupLatLng = latlng;
    const roundY = Math.round(latlng.lat);
    const roundX = Math.round(latlng.lng);
    const selectedFloor = document.getElementById('filterLantai').value || 'LG';

    // Filter kunci berdasarkan lantai yang sedang aktif
    const availableForPin = globalDataKunci.filter(function(k) {
      return String(k.lantai || '').toUpperCase() === selectedFloor.toUpperCase();
    });

    let popupContent = 
      '<div style="padding: 5px; width: 260px; font-family: sans-serif;">' +
        '<div style="font-weight: bold; font-size: 14px; margin-bottom: 2px;">📍 Pasang Pin di Koordinat:</div>' +
        '<div style="font-size: 12px; color: #64748b; margin-bottom: 8px;">Y: ' + roundY + ', X: ' + roundX + ' (Lantai ' + selectedFloor + ')</div>' +
        
        '<!-- Input Pencarian -->' +
        '<input type="text" id="searchPopupKey" placeholder="🔍 Cari ID atau Nama Kunci..." ' +
        '  style="width: 100%; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; margin-bottom: 6px; box-sizing: border-box;" ' +
        '  onkeyup="filterDropdownPopup()">' +

        '<!-- Dropdown Kunci -->' +
        '<select id="selectKeyForPin" size="5" style="width: 100%; padding: 4px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; margin-bottom: 8px; box-sizing: border-box;" onchange="fokusKePinKunci(this.value)">';

    availableForPin.forEach(function(k) {
      const keyId = k.id || k.nama;
      const hasPin = (k.koordinat && String(k.koordinat).trim() !== '');
      const pinStatusTag = hasPin ? ' 📍 (Sudah ada pin)' : '';
      
      popupContent += '<option value="' + keyId + '">' + keyId + ' - ' + k.nama + pinStatusTag + '</option>';
    });

    popupContent += 
        '</select>' +
        '<button onclick="eksekusiSimpanPin(' + roundY + ',' + roundX + ')" ' +
        '  style="width: 100%; background: #0084c7; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;">' +
        '  Simpan Pin Kunci' +
        '</button>' +
      '</div>';

    L.popup()
      .setLatLng(latlng)
      .setContent(popupContent)
      .openOn(map);
  }

  // 1. Fitur Pencarian di dalam Modal Popup
  function filterDropdownPopup() {
    const input = document.getElementById('searchPopupKey').value.toLowerCase();
    const select = document.getElementById('selectKeyForPin');
    const options = select.options;

    for (let i = 0; i < options.length; i++) {
      const text = options[i].text.toLowerCase();
      if (text.includes(input)) {
        options[i].style.display = '';
      } else {
        options[i].style.display = 'none';
      }
    }
  }

  // 2. Arahkan peta secara otomatis ke lokasi pin jika item yang dipilih sudah punya koordinat
  function fokusKePinKunci(keyId) {
    const item = globalDataKunci.find(function(k) {
      return String(k.id || k.nama) === String(keyId);
    });

    if (item && item.koordinat && String(item.koordinat).trim() !== '') {
      let coords = String(item.koordinat).split(',').map(function(n) { return parseFloat(n.trim()); });
      if (coords.length === 2 && !isNaN(coords[0])) {
        map.panTo(coords, { animate: true, duration: 0.8 });
      }
    }
  }

  // 3. Simpan Koordinat Kunci
  function eksekusiSimpanPin(y, x) {
    const select = document.getElementById('selectKeyForPin');
    const selectedKeyId = select.value;

    if (!selectedKeyId) {
      alert("⚠️ Silakan pilih kunci terlebih dahulu dari daftar!");
      return;
    }

    const strKoordinat = y + ',' + x;
    simpanKoordinatKeDatabase(selectedKeyId, strKoordinat);
    map.closePopup();
  }

  // Event Listener Klik pada Peta
  map.on('click', function(e) {
    if (isAdminMode) {
      bukaPopupPasangPin(e.latlng);
    }
  });
</script>
</body>
</html>
