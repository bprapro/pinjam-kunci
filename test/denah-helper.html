<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Lokasi Kunci & Layout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #4edcd4;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app-container {
            display: flex;
            width: 100%;
            max-width: 1300px;
            height: 90vh;
            background-color: #4edcd4;
            gap: 20px;
        }

        .cidebar {
            width: 320px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 10px;
            gap: 16px;
        }

        .input-group input, 
        .input-group select {
            width: 100%;
            padding: 14px 22px;
            border: none;
            border-radius: 35px;
            font-size: 15px;
            font-weight: 500;
            color: #333;
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.5);
        }

        .btn-cari {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 35px;
            background-color: #afafaf;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .btn-cari:hover {
            background-color: #2e7d6e;
        }

        .btn-cari:active {
            transform: scale(0.98);
        }

        .back-link {
            text-align: center;
            font-size: 14px;
            color: #1a3c40;
            margin-top: 10px;
            text-decoration: none;
        }

        .back-link strong {
            font-weight: 700;
        }

        .main-content {
            flex: 1;
            background-color: #ffffff;
            border-radius: 32px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 15px 30px rgba(0,0,0,0.08);
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-image {
            max-width: 95%;
            max-height: 85%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .location-tag {
            position: absolute;
            z-index: 10;
            cursor: pointer;
        }

        .tag-dot {
            width: 14px;
            height: 14px;
            background-color: #ffffff;
            border: 3px solid #365b4e;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            position: relative;
        }

        .tag-dot::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.6);
            animation: pulse 2s infinite;
            z-index: -1;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .tag-popup {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateYmpx);
            background: rgba(45, 62, 53, 0.85);
            backdrop-filter: blur(8px);
            color: white;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 13px;
            white-space: nowrap;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tag-popup::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0 6px;
            border-style: solid;
            border-color: rgba(45, 62, 53, 0.85) transparent transparent transparent;
        }

        .location-tag:hover .tag-popup {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .controls {
            position: absolute;
            bottom: 25px;
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .zoom-controls, .fit-control {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 16px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-btn {
            background: none;
            border: none;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: rgba(0,0,0,0.05);
        }

        .fit-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
        }
    </style>
</head>
 body>

    <div class="app-container">
        <div class="sidebar">
            <div class="input-group">
                <input type="text" id="lantai" value="Lantai : LG" placeholder="Lantai">
            </div>
            
            <div class="input-group">
                <input type="text" id="zona" value="Zona : A" placeholder="Zona">
            </div>
            
            <div class="input-group">
                <input type="text" id="kunci" value="Nomor Kunci : 3 - PINTU KACA" placeholder="Nomor Kunci">
            </div>
            
            <button class="btn-cari" onclick="cariLokasi()">Cari</button>
            
            <a href="#" class="back-link">Kembali ke <strong>form peminjaman kunci</strong></a>
        </div>

        <div class="main-content">
            <div class="map-wrapper">
                <img src="https://via.placeholder.com/1000x700/f8f9fa/cccccc?text=Denah+Layout+Lantai" alt="Layout Plan" class="map-image" id="mapImage">
                <div class="location-tag" style="top: 45%; left: 52%;">
                    <div class="tag-dot"></div>
                    <div class="tag-popup">
                        <div>
                            <strong>Pintu Kaca (3)</strong><br>
                            <span style="font-size: 11px; opacity: 0.8;">Zona A • LG Floor</span>
                        </div>
                    </div>
                </div>
                <div class="location-tag" style="top: 30%; left: 35%;">
                    <div class="tag-dot"></div>
                    <div class="tag-popup">
                        <div>
                            <strong>Ruang Server</strong><br>
                            <span style="font-size: 11px; opacity: 0.8;">Kunci No. 12</span>
                        </div>
                    </div>
                </div>
                <div class="location-tag" style="top: 65%; left: 70%;">
                    <div class="tag-dot"></div>
                    <div class="tag-popup">
                        <div>
                            <strong>Area Alun-Alun</strong><br>
                            <span style="font-size: 11px; opacity: 0.8;">Atrium Utama</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="controls">
                <div class="zoom-controls">
                    <button class="control-btn" onclick="zoomIn()">+</button>
                    <span style="color: #ccc;">|</span>
                    <button class="control-btn" onclick="zoomOut()">-</button>
                </div>
                
                <div class="fit-control">
                    <button class="fit-btn" onclick="resetZoom()">Fit</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentScale = 1;
        const mapImage = document.getElementById('mapImage');

        function zoomIn() {
            currentScale += 0.15;
            mapImage.style.transform = `scale(${currentScale});
        }

        function zoomOut() {
            if (currentScale > 0.6) {
                currentScale -= 0.15;
                mapImage.style.transform = `scale(${currentScale})`;
            }
        }

        function resetZoom() {
            currentScale = 1;
            mapImage.style.transform = `scale(1)`;
        }

        function cariLokasi() {
            alert("Mencari lokasi kunci...");
        }
    </script>
</body>
</html>
