<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,y initial-scale=1.0">
  <title>Pilih Lokasi Kunci - Denah Mall</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@0.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #55e0e7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 1250px;
      display: flex;
      gap: 30px;
      align-items: stretch;
    }

    .sidebar {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 15px;
      padding: 10px;
      min-width: 300px;
    }

    .select-wrapper {
      position: relative;
    }
    
    .select-wrapper::after {
      content: 'v';
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #718096;
      font-size: 16px;
    }

    .select-pill, .btn-cari {
      width: 100%;
      padding: 16px 24px;
      border-radius: 50px;
      border: none;
      outline: none;
      font-size: 15px;
      font-weight: 600;
      color: #2d3748;
      background: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      appearance: none;
      cursor: pointer;
    }

    .btn-cari {
      background: #b0b0b0;
      color: #ffffff;
      text-align: center;
      margin-top: 5px;
      font-weight: 700;
    }

    .btn-cari:hover {
      background: #999999;
    }

    .back-link {
      color: #1a202c;
      text-decoration: none;
      font-size: 14px;
      margin-top: 10px;
      display: inline-block;
      font-weight: 500;
    }

    .map-wrapper {
      flex: 2.2;
      background: #ffffff;
      border-radius: 35px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    #map {
      width: 100%;
      height: 520px;
      background: #ffffff;
      border-radius: 20px;
    }

    .custom-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 15px;
      font-size: 20px;
      font-weight: 600;
      color: #2d3748;
    }

    .zoom-btn-group span {
      cursor: pointer;
      user-select: none;
      padding: 0 8px;
    }

    .btn-fit {
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    .custom-marker {
      width: 18px;
      height: 18px;
      background: #ffffff;
      border: 4px solid #2563eb;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.25);
      cursor: pointer;
    }

    .marker-borrowed {
      border-color: #ef4444 !important;
    }

    
    .leaflet-tooltip-custom {
      background: rgba(255, 255, 255, 0.9) !important;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.6) !important;
      border-radius: 18px !important;
      padding: 10px 16px !important;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12) !important;
      color: #1e293b !important;
      font-size: 13px !important;
      font-weight: 600 !important;
    }
    
    .leaflet-tooltip-custom::before {
      display: none;
    }

    .tooltip-tag {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tooltip-icon {
      width: 28px;
      height: 28px;
      background: #e2e8f0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-top: 3px;
      display: inline-block;
    }
    .status-available { background: #dcfce7; color: #166534; }
    .status-borrowed { background: #fee2e2; color: #991b1b; }

    @media (max-width: 900px) {
      .app-container { flex-direction: column; }
      #map { height: 400px; }
    }
  </style>
</head>
<body>

<div class="app-container">
  
  <div class="sidebar">
    <div class="select-wrapper">
      <select id="select-lantai" class="select-pill" onchange="loadLantaiData()">
        <option value="LG" selected>Lantai : LG</option>
        <option value="L1">Lantai : L1</option>
        <option value="L2">Lantai : L2</option>
        <option value="L3">Lantai : L3</option>
        <option value="L4">Lantai : L4</option>
      </select>
    </div>

    <div class="select-wrapper">
      <select id="select-zona" class="select-pill" onchange="filterKunciByZona()">
        <option value="A">Zona : A</option>
        <option value="B">Zona : B</option>
        <option value="C">Zona : C</option>
      </select>
    </div>

    <div class="select-wrapper">
      <select id="select-kunci" class="select-pill">
        <option value="">Nomor Kunci : Pilih di Peta</option>
      </div>

    <button class="btn-cari" onclick="submitPilihanKunci()">Cari</button>

    <div>
      <a href="index.html" class="back-link">Kembali ke <strong>form peminjaman kunci</strong></a>
    </div>
  </div>

  <div class="map-wrapper">
    <div id="map"></div>
    
    <div class="custom-controls">
      <div class="zoom-btn-group">
        <span onclick="map.zoomIn()">+</span>
        <span>|</span>
        <span onclick="map.zoomOut()">-</span>
      </div>
      <div class="btn-fit" onclick="resetViewMap()">Fit</div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -1,
    maxZoom: 2,
    zoomControl: false
  });

  const bounds = [[0, 0], [1000, 1400]];
  let currentOverlay = null;
  let markersGroup = L.layerGroup().addTo(map);

  const dataLantai = {
    'LG': {
      image: 'LG.jpg',
      keys: [
        { id: '3 - PINT% KACA', name: 'HERO Supermarket', coords: [500, 300], status: 'available', zone: 'A' },
        { id: 'LG-SANFU', name: 'SANFU', coords: [400, 300], status: 'available', zone: 'A' },
        { id: 'LG-SELMA', name: 'SELMA', coords: [550, 800], status: 'borrowed', zone: 'A' },
        { id: 'LG-AZKO', name: 'AZKO', coords: [700, 1000], status: 'available', zone: 'B' }
      ]
    },
    'L1': {
      image: 'N1.jpg',
      keys: [
        { id: 'L1-NIKE', name: 'NIKE Store', coords: [550, 150], status: 'available', zone: 'A' },
        { id: 'L1-ADIDAS', name: 'ADIDAS', coords: [750, 150], status: 'available', zone: 'A' },
        { id: 'N1-JD', name: 'JD SPORTS', coords: [550, 520], status: 'available', zone: 'B' },
        { id: 'N1-KKV', name: 'KKV', coords: [650, 920], status: 'available', zone: 'B' }
      ]
    },
    'L2': { image: 'L2.jpg', keys: [] },
    'L3': { image: 'L3.jpg', keys: [] },
    'L4': { image: 'L4.jpg', keys: [] }
  };

  function loadLantaiData() {
    const floor = document.getElementById('select-lantai').value;
    const currentData = dataLantai[floor];

    if (currentOverlay) map.removeLayer(currentOverlay);
    markersGroup.clearLayers();

    currentOverlay = L.imageOverlay(currentData.image, bounds).addTo(map);
    resetViewMap();

    populateKunciDropdown(currentData.keys);

    currentData.keys.forEach(kunci => {
      const isAvailable = kunci.status === 'available';
      
      const customIcon = L.divIcon({
        className: 'custom-marker ' + (!isAvailable ? 'marker-borrowed' : ''),
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });

      const marker = L.marker(kunci.coords, { icon: customIcon });

      const tooltipContent =
        '<div class="tooltip-tag">' +
          '<div class="tooltip-icon">K</div>' +
          '<div>' +
            '<div>' + kunci.name + '</div>' +
            '<div style="font-size: 11px; color: #64748b;">Kunci: ' + kunci.id + '</div>' +
            '<span class="status-badge ' + (isAvailable ? 'status-available' : 'status-borrowed') + '">' +
              (isAvailable ? 'Tersedia' : 'Dipinjam') +
            '</span>' +
          '</div>' +
        '</div>';

      marker.bindTooltip(tooltipContent, {
        permanent: false,
        direction: 'top',
        offset: [0, -10],
        className: 'leaflet-tooltip-custom'
      });

      marker.on('click', function() {
        if (!isAvailable) {
          alert('Kunci ' + kunci.name + ' (' + kunci.id + ') sedang dipinjam!');
          return;
        }
        document.getElementById('select-zona').value = kunci.zone;
        document.getElementById('select-kunci').value = kunci.id;
      });

      markersGroup.addLayer(marker);
    });
  }

  function populateKenciDropdown(keys) {
    const selectKunci = document.getElementById('select-kunci');
    selectKunci.innerHTML = '<option value="">Nomor Kunci : Pilih di Peta</option>';

    keys.forEach(kunci => {
      const opt = document.createElement('option');
      opt.value = kunci.id;
      opt.textContent = 'Nomor Kunci : ' + kunci.id;
      selectKunci.appendChild(opt);
    });
  }

  function filterKunciByZona() {
    const floor = document.getElementById('select-lantai').value;
    const selectedZona = document.getElementById('select-zona').value;
    const filteredKeys = dataLantai[floor].keys.filter(k => k.zone === selectedZona);
    
    populateKunciDropdown(filteredKeys);
  }

  function resetViewMap() {
    map.fitBounds(bounds);
  }

  function submitPilihanKunci() {
    const lantai = document.getElementById('select-lantai').value;
    const zona = document.getElementById('select-zona').value;
    const kunci = document.getElementById('select-kunci').value;

    if (!kunci) {
      alert('Silakan pilih kunci terlebih dahulu!');
      return;
    }

    window.location.href = 'index.html?lantai=' + lantai + '&zona=' + zona + '&kunci=' + encodeURIComponent(kunci);
  }

  loadLantaiData();
</script>

</body>
</html>
