<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilih Lokasi Kunci - Denah Mall</title>
  
  <!-- Font Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: 0;
    }

    .app-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1150px;
      background: #ffffff;
      border-radius: 40px;
      padding: 24px;
      display: flex;
      gap: 25px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
      align-items: stretch;
    }

    /* --- SIDEBAR FORM --- */
    .sidebar {
      flex: 1.2;
      padding: 15px 10px 10px 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand-logo {
      font-size: 16px;
      font-weight: 800;
      color: #375b4f;
      letter-spacing: -0.5px;
      margin-bottom: 15px;
    }

    .form-title {
      font-size: 15px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 12px;
    }

    /* Filter Floor & Zone Row */
    .filter-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .select-wrapper {
      flex: 1;
      position: relative;
    }

    .select-pill {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      outline: none;
      font-size: 13px;
      font-weight: 600;
      color: #0d9488;
      background: #f8fafc;
      appearance: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .select-pill:hover { background: #f1f5f9; }

    .select-wrapper::after {
      content: '▾';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #0d9488;
      font-size: 12px;
    }

    /* Search Input Box */
    .search-wrapper {
      position: relative;
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      outline: none;
      font-size: 13px;
      color: #374151;
      background: #ffffff;
    }

    .search-input::placeholder { color: #9ca3af; }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: #6b7280;
    }

    /* Multi-select Checkbox Box Container */
    .checkbox-container {
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      max-height: 260px;
      overflow-y: auto;
      background: #ffffff;
      padding: 6px 0;
    }

    .key-item {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid #f3f4f6;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease;
      user-select: none;
    }

    .key-item:last-child { border-bottom: none; }
    .key-item:hover { background: #f8fafc; }

    .key-item input[type="checkbox"] {
      margin-right: 12px;
      width: 16px;
      height: 16px;
      accent-color: #375b4f;
      cursor: pointer;
    }

    .key-label {
      font-weight: 700;
      color: #1f2937;
    }

    .key-tag {
      font-weight: 500;
      color: #9ca3af;
      font-size: 12px;
      margin-left: 6px;
    }

    .key-item.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #fef2f2;
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      border-radius: 50px;
      border: none;
      background: #375b4f;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.2s ease;
      box-shadow: 0 10px 20px rgba(55, 91, 79, 0.25);
    }

    .btn-submit:hover {
      background: #2b473e;
      transform: translateY(-1px);
    }

    .footer-link {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: #6b7280;
    }

    .footer-link a {
      color: #111827;
      font-weight: 700;
      text-decoration: none;
    }

    /* --- MAP CONTAINER --- */
    .map-wrapper {
      flex: 1.5;
      border-radius: 32px;
      overflow: hidden;
      position: relative;
      min-height: 520px;
      background: #f1f5f9;
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 520px;
      background: #f1f5f9;
      z-index: 1;
    }

    .custom-controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 5;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 8px 18px;
      display: flex;
      gap: 15px;
      font-size: 14px;
      font-weight: 700;
      color: #111827;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .custom-controls span { cursor: pointer; user-select: none; }
    .custom-controls span:hover { color: #375b4f; }

    /* --- MARKER PIN ALA VOYAGER --- */
    .custom-marker { position: relative; }

    .marker-dot {
      width: 16px;
      height: 16px;
      background: #ffffff;
      border: 3px solid #375b4f;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(0,0,0,0.35);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .custom-marker:hover .marker-dot, .marker-dot.selected {
      transform: scale(1.35);
      background: #375b4f;
      box-shadow: 0 0 15px rgba(55, 91, 79, 0.8);
    }

    .marker-dot.borrowed { border-color: #ef4444; }

    .leaflet-tooltip-voyager {
      background: rgba(255, 255, 255, 0.9) !important;
      backdrop-filter: blur(12px) !important;
      border: 1px solid rgba(255, 255, 255, 0.7) !important;
      border-radius: 20px !important;
      padding: 10px 16px !important;
      box-shadow: 0 15px 35px rgba(0,0,0,0.12) !important;
      color: #111827 !important;
      font-size: 13px !important;
    }
    
    .leaflet-tooltip-voyager::before { display: none; }

    .tooltip-card {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tooltip-icon {
      width: 30px;
      height: 30px;
      background: rgba(55, 91, 79, 0.1);
      color: #375b4f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .status-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
      margin-top: 3px;
      display: inline-block;
    }
    .status-available { background: #dcfce7; color: #15803d; }
    .status-borrowed { background: #fee2e2; color: #b91c1c; }

    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #375b4f;
    }

    @media (max-width: 850px) {
      .app-card { flex-direction: column; border-radius: 30px; }
      .sidebar { padding: 10px; }
      .map-wrapper { min-height: 400px; border-radius: 24px; }
      #map { min-height: 400px; }
    }
  </style>
</head>
<body>

<div class="app-card">
  
  <!-- FORM SIDEBAR KIRI -->
  <div class="sidebar">
    <div>
      <div class="brand-logo">keymanager</div>
      <div class="form-title">Pilih Kunci / Ruangan:</div>

      <!-- Filter Floor & Zone Dropdown -->
      <div class="filter-row">
        <div class="select-wrapper">
          <select id="filter-floor" class="select-pill" onchange="onFloorOrZoneChange()">
            <option value="ALL">All Floor</option>
            <option value="LG">Lantai LG</option>
            <option value="L1">Lantai L1</option>
            <option value="L2">Lantai L2</option>
            <option value="L3">Lantai L3</option>
            <option value="L4">Lantai L4</option>
          </select>
        </div>
        <div class="select-wrapper">
          <select id="filter-zone" class="select-pill" onchange="renderKeyList()">
            <option value="ALL">All Zone</option>
            <option value="A">Zone A</option>
            <option value="B">Zone B</option>
            <option value="C">Zone C</option>
          </select>
        </div>
      </div>

      <!-- Input Search -->
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input" placeholder="Ketik nama ruangan / ID kunci..." oninput="renderKeyList()">
      </div>

      <!-- Container Checkbox Kunci -->
      <div class="checkbox-container" id="key-list-container">
        <!-- Kunci dirender secara dinamis melalui JS -->
      </div>

      <button class="btn-submit" onclick="submitPilihanKunci()">Pilih Kunci Ini</button>
    </div>

    <div class="footer-link">
      Kembali ke <a href="index.html">Form Peminjaman</a>
    </div>
  </div>

  <!-- CONTAINER PETA DENAH KANAN -->
  <div class="map-wrapper">
    <div id="loading-indicator" class="loading-overlay" style="display: none;">Memuat Data Kunci Spreadsheet...</div>
    <div id="map"></div>
    
    <div class="custom-controls">
      <span onclick="map.zoomIn()">+</span>
      <span style="opacity: 0.3;">|</span>
      <span onclick="map.zoomOut()">-</span>
      <span style="opacity: 0.3;">|</span>
      <span onclick="resetViewMap()">Reset</span>
    </div>
  </div>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxGoHYvbAnvd3IjS1eQrUUiChTY--AFqCzQoTHtfg97k5hreaTqEnruiF5MmaqqXFyrQA/exec";

  const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: -2,
    maxZoom: 2,
    zoomControl: false
  });

  let currentOverlay = null;
  let activeImageBounds = [[0, 0], [1000, 1400]];
  let markersGroup = L.layerGroup().addTo(map);

  const gambarDenahLantai = {
    'LG': './LG.jpg',
    'L1': './L1.jpg',
    'L2': './L2.jpg',
    'L3': './L3.jpg',
    'L4': './L4.jpg'
  };

  const koordinatKunciMap = {
    '1': [480, 300],
    '2': [500, 450],
    '3': [520, 600],
    '4': [550, 750],
    '5': [600, 900],
    '6': [650, 1050]
  };

  let globalDataKunci = [];
  let selectedKeyIds = new Set();

  // Fetch data Spreadsheet
  async function fetchSpreadsheetData() {
    toggleLoading(true);
    try {
      const response = await fetch(`${WEB_APP_URL}?aksi=ambil_status_lengkap`);
      const data = await response.json();
      
      if (Array.isArray(data)) {
        globalDataKunci = data;
      } else {
        globalDataKunci = [];
      }
      onFloorOrZoneChange();
    } catch (error) {
      console.error("Gagal mengambil data dari Apps Script:", error);
      alert("Gagal memuat data dari Spreadsheet. Menampilkan mode standar.");
      onFloorOrZoneChange();
    } finally {
      toggleLoading(false);
    }
  }

  // Dipanggil saat Filter Floor diubah
  function onFloorOrZoneChange() {
    const floorSelect = document.getElementById('filter-floor').value;
    const currentFloor = floorSelect === 'ALL' ? 'LG' : floorSelect;
    
    renderMapOverlay(currentFloor);
  }

  // Render Overlay Peta Denah
  function renderMapOverlay(selectedFloor) {
    const imagePath = gambarDenahLantai[selectedFloor] || './LG.jpg';

    if (currentOverlay) map.removeLayer(currentOverlay);
    markersGroup.clearLayers();

    const img = new Image();
    img.src = imagePath;
    img.onload = function() {
      const h = this.height || 1000;
      const w = this.width || 1400;
      activeImageBounds = [[0, 0], [h, w]];
      
      currentOverlay = L.imageOverlay(imagePath, activeImageBounds).addTo(map);
      resetViewMap();
      renderKeyList();
    };
    
    img.onerror = function() {
      activeImageBounds = [[0, 0], [1000, 1400]];
      currentOverlay = L.imageOverlay(imagePath, activeImageBounds).addTo(map);
      resetViewMap();
      renderKeyList();
    };
  }

  // Render Checkbox List dan Pin Peta
  function renderKeyList() {
    markersGroup.clearLayers();
    const container = document.getElementById('key-list-container');
    container.innerHTML = '';

    const selectedFloor = document.getElementById('filter-floor').value;
    const selectedZone = document.getElementById('filter-zone').value;
    const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();

    const mapH = activeImageBounds[1][0];
    const mapW = activeImageBounds[1][1];

    // Filter daftar kunci
    const filteredKeys = globalDataKunci.filter(k => {
      const matchFloor = (selectedFloor === 'ALL') || (String(k.lantai || '').toUpperCase() === selectedFloor.toUpperCase());
      const matchZone = (selectedZone === 'ALL') || (String(k.zona || '').toUpperCase() === selectedZone.toUpperCase());
      const keyText = `\({k.id || ''}\){k.nama || ''}`.toLowerCase();
      const matchSearch = keyText.includes(searchQuery);

      return matchFloor && matchZone && matchSearch;
    });

    if (filteredKeys.length === 0) {
      container.innerHTML = '<div style="padding: 15px; text-align: center; color: #9ca3af; font-size: 13px;">Kunci tidak ditemukan</div>';
      return;
    }

    filteredKeys.forEach((kunci, index) => {
      const keyId = kunci.id || kunci.nama;
      const isAvailable = String(kunci.status || 'Tersedia').toLowerCase() === 'tersedia';
      const isChecked = selectedKeyIds.has(keyId);

      // 1. Buat Element List Checkbox
      const itemEl = document.createElement('div');
      itemEl.className = `key-item ${isAvailable ? '' : 'disabled'}`;
      
      itemEl.innerHTML = `
        <input type="checkbox" id="chk-\({keyId}" value="\){keyId}" \({isChecked ? 'checked' : ''}\){isAvailable ? '' : 'disabled'}>
        <label for="chk-${keyId}" style="cursor: pointer; width: 100%; display: flex; align-items: center;">
          <span class="key-label">\({kunci.id ? kunci.id + ' - ' : ''}\){kunci.nama}</span>
          <span class="key-tag">[Lantai \({kunci.lantai || '-'} -\){kunci.zona || '-'}]</span>
        </label>
      `;

      // Event Checkbox Click
      const checkbox = itemEl.querySelector('input');
      checkbox.addEventListener('change', (e) => {
        if (e.target.checked) {
          selectedKeyIds.add(keyId);
        } else {
          selectedKeyIds.delete(keyId);
        }
        renderKeyList(); // Re-render untuk meng-update status tampilan pin
      });

      container.appendChild(itemEl);

      // 2. Tampilkan Pin Hanya untuk Lantai yang sedang aktif di Peta
      const currentFloorMap = document.getElementById('filter-floor').value === 'ALL' ? 'LG' : document.getElementById('filter-floor').value;
      
      if (String(kunci.lantai || '').toUpperCase() === currentFloorMap.toUpperCase()) {
        let coords = koordinatKunciMap[kunci.id] || koordinatKunciMap[kunci.nama];
        if (!coords) {
          const col = index % 4;
          const row = Math.floor(index / 4);
          coords = [mapH * 0.3 + (row * 100), mapW * 0.2 + (col * 200)];
        }

        const customIcon = L.divIcon({
          className: 'custom-marker',
          html: `<div class="marker-dot \({isAvailable ? '' : 'borrowed'}\){isChecked ? 'selected' : ''}"></div>`,
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });

        const marker = L.marker(coords, { icon: customIcon });

        const tooltipContent = `
          <div class="tooltip-card">
            <div class="tooltip-icon">🔑</div>
            <div>
              <div style="font-weight: 700; color: #111827;">${kunci.nama}</div>
              <div style="font-size: 11px; color: #6b7280;">ID: ${kunci.id || '-'}</div>
              \({!isAvailable ? `<div style="font-size: 11px; color: #ef4444; font-weight: 600;">Peminjam:\){kunci.peminjam}</div>` : ''}
              <span class="status-badge ${isAvailable ? 'status-available' : 'status-borrowed'}">
                ${isAvailable ? '● Tersedia' : '● Dipinjam'}
              </span>
            </div>
          </div>
        `;

        marker.bindTooltip(tooltipContent, {
          permanent: false,
          direction: 'top',
          offset: [0, -10],
          className: 'leaflet-tooltip-voyager'
        });

        marker.on('click', () => {
          if (!isAvailable) {
            alert(`Kunci \({kunci.nama} (\){kunci.id}) sedang dipinjam oleh ${kunci.peminjam}!`);
            return;
          }
          
          // Toggle Pilihan Kunci via Klik Marker Pin
          if (selectedKeyIds.has(keyId)) {
            selectedKeyIds.delete(keyId);
          } else {
            selectedKeyIds.add(keyId);
          }
          renderKeyList();
        });

        markersGroup.addLayer(marker);
      }
    });
  }

  function resetViewMap() {
    map.fitBounds(activeImageBounds);
  }

  function toggleLoading(show) {
    document.getElementById('loading-indicator').style.display = show ? 'flex' : 'none';
  }

  function submitPilihanKunci() {
    const keysArray = Array.from(selectedKeyIds);

    if (keysArray.length === 0) {
      alert('Silakan pilih minimal satu kunci terlebih dahulu!');
      return;
    }

    const kunciQueryParam = keysArray.join(',');
    window.location.href = `index.html?kunci=${encodeURIComponent(kunciQueryParam)}`;
  }

  fetchSpreadsheetData();
</script>

</body>
</html>
